<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12223c" />
      <stop offset="50%" stop-color="#1a3359" />
      <stop offset="100%" stop-color="#0b1626" />
    </linearGradient>
    <linearGradient id="avatarGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#cba258" />
    </linearGradient>
    <linearGradient id="bustGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="200" height="200" fill="url(#avatarBg)" />

  <!-- Subtle Radial Aura -->
  <circle cx="100" cy="85" r="70" fill="url(#avatarGold)" opacity="0.12" />

  <!-- Circular Outer Border Ring -->
  <circle cx="100" cy="100" r="96" fill="none" stroke="url(#avatarGold)" stroke-width="3" opacity="0.4" />

  <!-- Silhouette Bust: Head -->
  <circle cx="100" cy="74" r="32" fill="url(#bustGrad)" filter="url(#softGlow)" />

  <!-- Silhouette Bust: Neck -->
  <rect x="91" y="100" width="18" height="16" rx="4" fill="url(#bustGrad)" />

  <!-- Silhouette Bust: Shoulders & Alb -->
  <path d="M 44 165 C 44 125, 72 114, 100 114 C 128 114, 156 125, 156 165 C 156 178, 148 184, 100 184 C 52 184, 44 178, 44 165 Z" fill="url(#bustGrad)" filter="url(#softGlow)" />

  <!-- Liturgical Collar / V-neck Golden Accent -->
  <path d="M 88 114 L 100 134 L 112 114 Z" fill="none" stroke="url(#avatarGold)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Gold Cross / Chi-Rho Pendant on Chest -->
  <path d="M 100 138 L 100 156 M 94 144 L 106 144" fill="none" stroke="url(#avatarGold)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Camera / Photo Slot Badge at Bottom-Right -->
  <g transform="translate(138, 138)" filter="url(#softGlow)">
    <circle cx="20" cy="20" r="19" fill="#12223c" stroke="url(#avatarGold)" stroke-width="2" />
    <!-- Camera Icon -->
    <path d="M 12 16 L 14 13 L 26 13 L 28 16 L 31 16 C 32.1 16 33 16.9 33 18 L 33 26 C 33 27.1 32.1 28 31 28 L 9 28 C 7.9 28 7 27.1 7 26 L 7 18 C 7 16.9 7.9 16 9 16 Z" fill="url(#avatarGold)" />
    <circle cx="20" cy="22" r="4.5" fill="#12223c" />
    <circle cx="20" cy="22" r="3" fill="url(#avatarGold)" />
  </g>
</svg>
