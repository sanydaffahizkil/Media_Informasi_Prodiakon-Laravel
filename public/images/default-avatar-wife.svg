<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="avatarWifeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151b33" />
      <stop offset="50%" stop-color="#241b38" />
      <stop offset="100%" stop-color="#0e1324" />
    </linearGradient>
    <linearGradient id="avatarRoseGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="60%" stop-color="#e0a96d" />
      <stop offset="100%" stop-color="#cba258" />
    </linearGradient>
    <linearGradient id="femaleBustGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <filter id="softGlowWife" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="200" height="200" fill="url(#avatarWifeBg)" />

  <!-- Subtle Radial Aura -->
  <circle cx="100" cy="85" r="70" fill="url(#avatarRoseGold)" opacity="0.12" />

  <!-- Circular Outer Border Ring -->
  <circle cx="100" cy="100" r="96" fill="none" stroke="url(#avatarRoseGold)" stroke-width="3" opacity="0.4" />

  <!-- Silhouette Bust: Hair Volume Behind -->
  <circle cx="100" cy="68" r="35" fill="url(#femaleBustGrad)" opacity="0.8" />
  <path d="M 68 76 C 68 50, 132 50, 132 76 C 134 94, 126 104, 122 108 C 114 96, 86 96, 78 108 C 74 104, 66 94, 68 76 Z" fill="url(#femaleBustGrad)" />

  <!-- Silhouette Bust: Head -->
  <circle cx="100" cy="74" r="28" fill="url(#femaleBustGrad)" filter="url(#softGlowWife)" />

  <!-- Silhouette Bust: Graceful Neck -->
  <path d="M 93 100 L 93 115 C 93 117, 107 117, 107 115 L 107 100 Z" fill="url(#femaleBustGrad)" />

  <!-- Silhouette Bust: Shoulders & Blouse -->
  <path d="M 46 166 C 46 128, 74 116, 100 116 C 126 116, 154 128, 154 166 C 154 178, 146 184, 100 184 C 54 184, 46 178, 46 166 Z" fill="url(#femaleBustGrad)" filter="url(#softGlowWife)" />

  <!-- Elegant V-neckline -->
  <path d="M 88 116 Q 100 138 112 116" fill="none" stroke="url(#avatarRoseGold)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Liturgical Cross / Heart Pendant on Neck -->
  <path d="M 100 126 L 100 138 M 96 130 L 104 130" fill="none" stroke="url(#avatarRoseGold)" stroke-width="2" stroke-linecap="round" />

  <!-- Camera / Photo Slot Badge at Bottom-Right -->
  <g transform="translate(138, 138)" filter="url(#softGlowWife)">
    <circle cx="20" cy="20" r="19" fill="#1e1832" stroke="url(#avatarRoseGold)" stroke-width="2" />
    <!-- Camera Icon -->
    <path d="M 12 16 L 14 13 L 26 13 L 28 16 L 31 16 C 32.1 16 33 16.9 33 18 L 33 26 C 33 27.1 32.1 28 31 28 L 9 28 C 7.9 28 7 27.1 7 26 L 7 18 C 7 16.9 7.9 16 9 16 Z" fill="url(#avatarRoseGold)" />
    <circle cx="20" cy="22" r="4.5" fill="#1e1832" />
    <circle cx="20" cy="22" r="3" fill="url(#avatarRoseGold)" />
  </g>
</svg>
